<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cut Review</title>
<style>
:root { color-scheme: light dark; --bg:#fafaf8; --panel:#fff; --line:#ddd9d0; --text:#22211e; --muted:#6d6a62;
  --accent:#17627a; --wave:#7f9ca8; --cut:#17627a26; --good:#2e7d4f; --warn:#b26a00; --bad:#b3362b; }
@media (prefers-color-scheme: dark) { :root { --bg:#191a1b; --panel:#232526; --line:#3a3c3e; --text:#ecebe6; --muted:#a3a198;
  --accent:#62b6d3; --wave:#6d8590; --cut:#62b6d330; --good:#62c188; --warn:#e0a24a; --bad:#ef7a6e; } }
* { box-sizing:border-box }
body { margin:0; height:100vh; display:grid; grid-template-columns:minmax(280px,380px) 1fr; background:var(--bg); color:var(--text); font:15px/1.4 system-ui,sans-serif }
aside { display:flex; flex-direction:column; border-right:1px solid var(--line); min-height:0 }
.filters { padding:10px; display:flex; flex-wrap:wrap; gap:6px; border-bottom:1px solid var(--line) }
.progress { width:100%; color:var(--muted); font-size:13px }
select,input,button { font:inherit; color:inherit; background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:4px 8px }
button { cursor:pointer } button:hover { border-color:var(--accent) }
button.on { background:var(--accent); color:var(--panel); border-color:var(--accent) }
#list { overflow-y:auto; flex:1 }
.row { padding:7px 10px; border-bottom:1px solid var(--line); cursor:pointer; display:grid; grid-template-columns:12px 1fr; gap:8px }
.row:hover { background:var(--cut) } .row.sel { background:var(--cut); box-shadow:inset 3px 0 var(--accent) }
.dot { width:10px; height:10px; border-radius:50%; margin-top:5px; background:var(--good) }
.dot.warn { background:var(--warn) } .dot.bad { background:var(--bad) } .dot.done { background:none; border:2px solid var(--good) }
.who { font-weight:600; font-size:13px } .who small { font-weight:400; color:var(--muted) }
.snippet { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--muted); font-size:13px }
main { overflow-y:auto; padding:18px 22px; min-width:0 }
h1 { font-size:19px; margin:0 0 4px } .said { font-size:17px; margin:0 0 4px } .heard { color:var(--muted); margin:0 0 12px; min-height:1.4em }
canvas { width:100%; height:150px; display:block; background:var(--panel); border:1px solid var(--line); border-radius:6px; touch-action:none; cursor:crosshair }
.bar { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin:10px 0 }
.bar .gap { width:14px } .time { font-variant-numeric:tabular-nums; min-width:150px }
h2 { font-size:14px; margin:18px 0 6px; color:var(--muted); font-weight:600 }
.take { display:flex; gap:8px; align-items:center; padding:5px 0; border-bottom:1px solid var(--line) }
.take span { flex:1; min-width:0 } .take.cur span { font-weight:600 }
#words { line-height:1.9 } #words span { cursor:pointer; padding:1px 2px; border-radius:3px } #words span:hover { background:var(--cut) } #words span.in { color:var(--accent); font-weight:600 }
.hint { color:var(--muted); font-size:13px } kbd { border:1px solid var(--line); border-radius:4px; padding:0 4px; font-size:12px }
#error { color:var(--bad); min-height:1.3em }
@media (max-width:760px) { body { grid-template-columns:1fr; grid-template-rows:38vh 1fr } aside { border-right:0; border-bottom:1px solid var(--line) } main { padding:12px 16px } }
</style>
</head>
<body>
<aside>
  <div class="filters">
    <select id="filter" aria-label="Filter">
      <option value="review">Zu prüfen</option><option value="missing">Nicht gefunden</option>
      <option value="moved">Spätere Wiederholung</option><option value="all">Alle</option>
    </select>
    <select id="character" aria-label="Rolle"><option value="">Alle Rollen</option></select>
    <div class="progress" id="progress"></div>
  </div>
  <div id="list"></div>
</aside>
<main>
  <h1 id="title"></h1>
  <p class="said" id="said"></p>
  <p class="heard" id="heard"></p>
  <canvas id="wave"></canvas>
  <div class="bar">
    <button id="play" title="Leertaste">▶ Schnitt</button>
    <button id="playContext" title="Taste C">▶ mit Kontext</button>
    <button id="stop">■</button>
    <span class="gap"></span>
    <button data-zoom="0.5">Zoom +</button><button data-zoom="2">Zoom −</button>
    <button data-pan="-1">◀</button><button data-pan="1">▶</button>
    <span class="gap"></span>
    <span class="time" id="time"></span>
  </div>
  <div class="bar">
    Anfang <button data-nudge="start,-0.1">−0.1</button><button data-nudge="start,0.1">+0.1</button>
    <span class="gap"></span>
    Ende <button data-nudge="end,-0.1">−0.1</button><button data-nudge="end,0.1">+0.1</button>
    <span class="gap"></span>
    <label>Gehe zu <input id="jump" size="8" placeholder="mm:ss"></label>
    <button id="placeHere" title="Setzt den Schnitt an die zuletzt angeklickte Stelle">Hier setzen</button>
  </div>
  <div class="bar">
    <button id="check" title="Enter: OK und weiter">✓ OK und weiter</button>
    <button id="skip">Weglassen</button>
    <button id="prev">↑ Zurück</button><button id="next">↓ Weiter</button>
  </div>
  <div id="error" role="alert"></div>
  <h2>Andere Fundstellen (Takes)</h2>
  <div id="takes"></div>
  <h2>Was Whisper hier verstanden hat (anklicken zum Abspielen)</h2>
  <div id="words"></div>
  <p class="hint">
    Griffe im Wellenbild ziehen. Sonst: Klick spielt ab dieser Stelle.
    <kbd>Leertaste</kbd> Schnitt spielen · <kbd>C</kbd> mit Kontext · <kbd>Enter</kbd> OK und weiter ·
    <kbd>↑</kbd><kbd>↓</kbd> andere Zeile · <kbd>←</kbd><kbd>→</kbd> Anfang · <kbd>Shift</kbd>+<kbd>←</kbd><kbd>→</kbd> Ende
  </p>
</main>
<script>
const $ = id => document.getElementById(id);
const CONTEXT = 4, HANDLE = 8;
let lines = [], visible = [], current = null, peaks = [];
let view = {start: 0, end: 20}, drag = null, lastClick = null, playback = null, audio = null, requestId = 0;

const format = t => t == null ? "–" : `${Math.floor(t / 60)}:${(t % 60).toFixed(1).padStart(4, "0")}`;
const clear = el => { while (el.firstChild) el.removeChild(el.firstChild); };

function state(line) {
  if (line.checked) return "done";
  if (line.skip) return "done";
  if (line.start == null || line.estimated) return "bad";
  const laterTake = line.takes.some(t => t.start > line.end && t.score >= line.score * 0.8);
  if (line.end - line.start < 0.3 || line.score < 0.3 || line.moved_to_later || laterTake && line.text.length > 15) return "warn";
  return "ok";
}

function matches(line) {
  const who = $("character").value;
  if (who && !line.character.split("+").map(s => s.trim()).includes(who)) return false;
  const filter = $("filter").value;
  if (filter === "all") return true;
  if (filter === "missing") return line.start == null || line.estimated;
  if (filter === "moved") return line.moved_to_later;
  return ["bad", "warn"].includes(state(line));
}

function renderList() {
  visible = lines.filter(matches);
  const list = $("list");
  clear(list);
  for (const line of visible) {
    const row = document.createElement("div");
    row.className = "row" + (current === line ? " sel" : "");
    row.onclick = () => select(line);
    const dot = document.createElement("div");
    dot.className = "dot " + state(line);
    const body = document.createElement("div");
    body.style.minWidth = 0;
    const who = document.createElement("div");
    who.className = "who";
    who.textContent = `${line.number} ${line.character} `;
    const when = document.createElement("small");
    when.textContent = line.skip ? "weggelassen" : format(line.start);
    who.append(when);
    const snippet = document.createElement("div");
    snippet.className = "snippet";
    snippet.textContent = line.text;
    body.append(who, snippet);
    row.append(dot, body);
    list.append(row);
    if (current === line) requestAnimationFrame(() => row.scrollIntoView({block: "nearest"}));
  }
  const done = lines.filter(l => l.checked).length;
  const open = lines.filter(l => ["bad", "warn"].includes(state(l))).length;
  $("progress").textContent = `${visible.length} angezeigt · ${done} bestätigt · ${open} noch zu prüfen · ${lines.length} total`;
}

function neighbourTime(line, direction) {
  for (let i = line.number + direction; i >= 0 && i < lines.length; i += direction) {
    if (lines[i].start != null) return direction < 0 ? lines[i].end : lines[i].start;
  }
  return null;
}

async function select(line) {
  stop();
  current = line;
  lastClick = null;
  $("title").textContent = `${line.number} · ${line.character}`;
  $("said").textContent = line.text;
  $("heard").textContent = line.heard ? `Gehört: ${line.heard}` : "Nicht automatisch gefunden. Stelle suchen, anklicken, „Hier setzen“.";
  if (line.start != null) {
    const pad = Math.max(3, (line.end - line.start) * 0.5);
    view = {start: Math.max(0, line.start - pad), end: line.end + pad};
  } else {
    const before = neighbourTime(line, -1) ?? 0;
    const after = neighbourTime(line, 1) ?? before + 30;
    view = {start: Math.max(0, before - 2), end: Math.min(after + 2, before + 300)};
  }
  renderDetails();
  renderList();
  await loadView();
}

function renderDetails() {
  const line = current;
  $("check").classList.toggle("on", !!line.checked);
  $("skip").classList.toggle("on", !!line.skip);
  $("time").textContent = line.start == null ? "kein Schnitt"
    : `${format(line.start)} – ${format(line.end)} (${(line.end - line.start).toFixed(1)} s)`;
  const takes = $("takes");
  clear(takes);
  if (!line.takes.length) takes.textContent = "Keine.";
  for (const take of line.takes) {
    const row = document.createElement("div");
    const isCurrent = line.start != null && take.start < line.end && take.end > line.start;
    row.className = "take" + (isCurrent ? " cur" : "");
    const listen = document.createElement("button");
    listen.textContent = "▶";
    listen.onclick = () => play(take.start - 0.2, take.end + 0.3);
    const label = document.createElement("span");
    label.textContent = `${format(take.start)} · ${Math.round(take.score * 100)} % · ${take.heard}`;
    const use = document.createElement("button");
    use.textContent = "Verwenden";
    use.onclick = async () => {
      await update({start: take.start, end: take.end, checked: true});
      await select(current);
    };
    row.append(listen, label, use);
    takes.append(row);
  }
}

async function loadView() {
  const id = ++requestId;
  const width = Math.max(200, $("wave").clientWidth);
  const response = await fetch(`/api/peaks?start=${view.start}&end=${view.end}&n=${width}`);
  const wordsResponse = await fetch(`/api/words?start=${view.start}&end=${view.end}`);
  if (id !== requestId) return;
  peaks = await response.json();
  renderWords(await wordsResponse.json());
  draw();
}

function renderWords(words) {
  const box = $("words");
  clear(box);
  if (!words.length) box.textContent = "Keine Wörter erkannt.";
  for (const word of words) {
    const span = document.createElement("span");
    span.textContent = word.w + " ";
    if (current.start != null && word.s < current.end && word.e > current.start) span.className = "in";
    span.onclick = () => { lastClick = word.s; play(word.s, view.end); };
    box.append(span);
  }
}

const xOf = t => (t - view.start) / (view.end - view.start) * $("wave").clientWidth;
const timeOf = x => view.start + x / $("wave").clientWidth * (view.end - view.start);

function draw() {
  const canvas = $("wave"), ratio = devicePixelRatio || 1;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  canvas.width = w * ratio; canvas.height = h * ratio;
  const c = canvas.getContext("2d");
  c.scale(ratio, ratio);
  const style = getComputedStyle(document.documentElement);
  const color = name => style.getPropertyValue(name);
  if (current && current.start != null) {
    c.fillStyle = color("--cut");
    c.fillRect(xOf(current.start), 0, xOf(current.end) - xOf(current.start), h);
  }
  c.fillStyle = color("--wave");
  const max = Math.max(0.02, ...peaks), step = w / Math.max(1, peaks.length);
  peaks.forEach((p, i) => {
    const height = Math.max(1, Math.sqrt(p / max) * (h - 24));
    c.fillRect(i * step, (h - height) / 2, Math.max(1, step), height);
  });
  c.fillStyle = color("--muted");
  c.font = "11px system-ui";
  const span = view.end - view.start;
  const tick = [1, 2, 5, 10, 30, 60, 120, 300].find(t => span / t < 12) || 600;
  for (let t = Math.ceil(view.start / tick) * tick; t < view.end; t += tick) {
    c.fillText(format(t).replace(/\.0$/, ""), xOf(t) + 2, h - 3);
    c.fillRect(xOf(t), h - 14, 1, 14);
  }
  if (current && current.start != null) {
    c.fillStyle = color("--accent");
    for (const t of [current.start, current.end]) {
      const x = xOf(t);
      c.fillRect(x - 1, 0, 2, h);
      c.fillRect(x - 5, 0, 10, 12);
    }
  }
  if (lastClick != null) { c.fillStyle = color("--warn"); c.fillRect(xOf(lastClick), 0, 1, h); }
  if (playback != null) { c.fillStyle = color("--bad"); c.fillRect(xOf(playback), 0, 2, h); }
}

async function update(changes) {
  $("error").textContent = "";
  const response = await fetch(`/api/line/${current.number}`, {
    method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(changes)});
  const reply = await response.json();
  if (!response.ok) { $("error").textContent = reply.error; return; }
  Object.assign(current, reply);
  renderDetails();
  renderList();
  draw();
}

function stop() {
  if (audio) { audio.pause(); audio = null; }
  playback = null;
  draw();
}

function play(start, end) {
  stop();
  start = Math.max(0, start);
  if (end <= start) return;
  const clip = new Audio(`/api/audio?start=${start}&end=${end}`);
  audio = clip;
  const tick = () => {
    if (audio !== clip) return;
    playback = start + clip.currentTime;
    draw();
    requestAnimationFrame(tick);
  };
  clip.onended = () => { if (audio === clip) stop(); };
  clip.onerror = () => { $("error").textContent = "Abspielen fehlgeschlagen."; };
  clip.play().then(tick).catch(error => { $("error").textContent = error.message; });
}

function playCut(context) {
  if (current.start == null) return;
  play(current.start - (context ? CONTEXT : 0), current.end + (context ? CONTEXT : 0));
}

// By number, since editing a line can drop it from the filtered list.
function neighbour(direction) {
  const candidates = visible.filter(l => (l.number - current.number) * direction > 0);
  return direction > 0 ? candidates[0] : candidates[candidates.length - 1];
}

function move(direction) {
  const target = neighbour(direction);
  if (target) select(target);
}

function nudge(edge, amount) {
  if (current.start == null) return;
  const value = Math.round((current[edge] + amount) * 100) / 100;
  update({[edge]: value, checked: true});
}

const canvas = $("wave");
canvas.onpointerdown = event => {
  const x = event.offsetX;
  if (current?.start != null) {
    const distances = [["start", Math.abs(x - xOf(current.start))], ["end", Math.abs(x - xOf(current.end))]];
    distances.sort((a, b) => a[1] - b[1]);
    if (distances[0][1] <= HANDLE) {
      drag = distances[0][0];
      canvas.setPointerCapture(event.pointerId);
      return;
    }
  }
  lastClick = timeOf(x);
  play(lastClick, current?.start != null && lastClick < current.end ? current.end + 1 : view.end);
};
canvas.onpointermove = event => {
  if (current?.start != null) {
    const near = Math.min(Math.abs(event.offsetX - xOf(current.start)), Math.abs(event.offsetX - xOf(current.end)));
    canvas.style.cursor = drag || near <= HANDLE ? "ew-resize" : "crosshair";
  }
  if (!drag) return;
  const t = timeOf(event.offsetX);
  current[drag] = drag === "start" ? Math.min(t, current.end - 0.05) : Math.max(t, current.start + 0.05);
  draw();
  $("time").textContent = `${format(current.start)} – ${format(current.end)} (${(current.end - current.start).toFixed(1)} s)`;
};
canvas.onpointerup = () => {
  if (!drag) return;
  drag = null;
  update({start: Math.round(current.start * 100) / 100, end: Math.round(current.end * 100) / 100, checked: true});
};

$("play").onclick = () => playCut(false);
$("playContext").onclick = () => playCut(true);
$("stop").onclick = stop;
$("prev").onclick = () => move(-1);
$("next").onclick = () => move(1);
$("check").onclick = async () => {
  await update({checked: true, skip: false});
  move(1);
};
$("skip").onclick = () => update({skip: !current.skip, checked: !current.skip});
$("placeHere").onclick = async () => {
  if (lastClick == null) { $("error").textContent = "Zuerst die gewünschte Stelle im Wellenbild anklicken."; return; }
  const length = Math.max(1.5, current.text.split(/\s+/).length * 0.4);
  await update({start: Math.round(lastClick * 100) / 100, end: Math.round((lastClick + length) * 100) / 100, checked: true, skip: false});
  draw();
  loadView();
};
$("jump").onkeydown = event => {
  if (event.key !== "Enter") return;
  event.stopPropagation();
  const parts = event.target.value.split(":").map(Number);
  const t = parts.length > 1 ? parts[0] * 60 + parts[1] : parts[0] * 60;
  if (!Number.isFinite(t)) return;
  const span = Math.min(60, view.end - view.start);
  view = {start: Math.max(0, t - span / 2), end: t + span / 2};
  loadView();
};
document.querySelectorAll("[data-zoom]").forEach(button => button.onclick = () => {
  const middle = (view.start + view.end) / 2;
  const span = Math.min(600, Math.max(2, (view.end - view.start) * Number(button.dataset.zoom)));
  view = {start: Math.max(0, middle - span / 2), end: Math.max(0, middle - span / 2) + span};
  loadView();
});
document.querySelectorAll("[data-pan]").forEach(button => button.onclick = () => {
  const span = view.end - view.start;
  view.start = Math.max(0, view.start + Number(button.dataset.pan) * span * 0.6);
  view.end = view.start + span;
  loadView();
});
document.querySelectorAll("[data-nudge]").forEach(button => button.onclick = () => {
  const [edge, amount] = button.dataset.nudge.split(",");
  nudge(edge, Number(amount));
});
$("filter").onchange = $("character").onchange = () => {
  renderList();
  if (!visible.includes(current) && visible.length) select(visible[0]);
};
document.addEventListener("keydown", event => {
  if (event.target.tagName === "INPUT" || event.target.tagName === "SELECT" || !current) return;
  const actions = {
    " ": () => audio ? stop() : playCut(false),
    c: () => playCut(true), Enter: () => $("check").click(),
    ArrowUp: () => move(-1), ArrowDown: () => move(1),
    ArrowLeft: () => nudge(event.shiftKey ? "end" : "start", -0.1),
    ArrowRight: () => nudge(event.shiftKey ? "end" : "start", 0.1),
  };
  if (actions[event.key]) { event.preventDefault(); actions[event.key](); }
});
addEventListener("resize", () => { if (current) loadView(); });

(async () => {
  lines = await (await fetch("/api/lines")).json();
  const names = new Set(lines.flatMap(l => l.character.split("+").map(s => s.trim())));
  for (const name of [...names].sort((a, b) => a.localeCompare(b))) {
    const option = document.createElement("option");
    option.value = option.textContent = name;
    $("character").append(option);
  }
  renderList();
  if (visible.length) select(visible[0]);
})();
</script>
</body>
</html>
